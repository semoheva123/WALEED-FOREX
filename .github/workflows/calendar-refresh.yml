# Refresh the economic calendar snapshot (data/economic-calendar.json) on a schedule.
# Primary source: Investing.com (Saudi Arabic). Fallback: Fair Economy / Forex Factory.
# If both sources fail, the previous snapshot is kept and the step only warns.
name: Refresh economic calendar

on:
  schedule:
    # About twice an hour (GitHub cron may run a few minutes early or late).
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update calendar snapshot
        run: python scripts/update_calendar.py || echo "::warning::Calendar refresh failed; previous snapshot kept."

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic-calendar.json
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "chore: refresh economic calendar snapshot"
            git push
          fi
