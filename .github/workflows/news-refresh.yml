# Refresh the market news snapshot (data/market-news.json) on a schedule.
# Source: Google News RSS (Arabic) with MyMemory translation when available.
# If the source fails, the previous snapshot is kept and the step only warns.
name: Refresh market news

on:
  schedule:
    # About every two hours (GitHub cron may run a few minutes early or late).
    - cron: '7,37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update news snapshot
        run: python scripts/update_news.py || echo "::warning::News refresh failed; previous snapshot kept."

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: refresh market news snapshot"
            git push
          fi
